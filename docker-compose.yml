# docker compose up            -> demo with the HUD on http://127.0.0.1:8777
# JARVIS_CMD=up docker compose up    -> your projects (mount them below) + markets if .env has Alpaca keys
services:
  jarvis:
    build: .
    command: ["${JARVIS_CMD:-demo}", "--no-browser"]
    env_file:
      - path: .env
        required: false
    environment:
      - JARVIS_DASHBOARD_TOKEN=${JARVIS_DASHBOARD_TOKEN:-}
    volumes:
      - jarvis-data:/home/jarvis/.jarvis
      # - ./jarvis.toml:/app/jarvis.toml:ro   # uncomment after creating jarvis.toml
      # - ~/projects:/home/jarvis/projects:ro  # let JARVIS read your projects (read-only)
    ports:
      - "127.0.0.1:8777:8777"   # published on localhost only
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
volumes:
  jarvis-data:
