[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-os"
version = "2.0.0"
description = "JARVIS: open-source AI command center for developers. Every project at a glance, ask anything with Claude Code / Codex / Gemini / Ollama, voice, phone calls, and an autonomous trading desk. Zero dependencies."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Begad Tamim" }]
keywords = [
  "jarvis", "ai-assistant", "personal-assistant", "ai-agent", "claude-code", "codex", "gemini-cli", "ollama",
  "voice-assistant", "developer-tools", "productivity", "llm", "autonomous-agent", "trading-bot", "alpaca",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Software Development",
  "Environment :: Web Environment",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
ai = ["anthropic>=0.70"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
jarvis = "jarvis.cli:main"

[project.urls]
Homepage = "https://github.com/begad-tamim/jarvis"
Issues = "https://github.com/begad-tamim/jarvis/issues"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
jarvis = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "N"]
ignore = ["S101", "S311", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "N"]
